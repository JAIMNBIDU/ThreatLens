services:
  backend:
    build: ./backend
    env_file:
      - ./backend/.env          # keys injected at runtime, never baked into the image
    environment:
      DB_PATH: /data/threatlens.db
      CORS_ORIGINS: http://localhost:8080
    volumes:
      - threatlens-data:/data    # SQLite cache/history persists across restarts
    expose:
      - "8000"                   # internal only; not published to the host
    restart: unless-stopped

  frontend:
    build: ./threatlens-ui
    ports:
      - "8080:8080"              # the only port exposed to the host
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  threatlens-data:
